# display names + hint text for the config.jelly form, keyed by field name
# (US-ASCII only -- java.util.Properties loads this as ISO-8859-1, so UTF-8
# text would reach the rendered form as mojibake; pinned in
# DevcruMfaConfigI18nTest.fileIsPureAscii)
policy=Gate policy
policy.hint=REQUIRED = MFA is mandatory for every user who has enrolled at least one factor. Unenrolled users are never hard-locked. OFF = the gate is inert (kill switch, use to fix-forward an incident without uninstalling).
issuer=Authenticator app label
issuer.hint=The issuer string shown next to the entry in authenticator apps (otpauth URI label).
rememberForHours=Remember trusted browsers for (hours)
rememberForHours.hint=Hours a successful MFA keeps a browser signed in without re-prompting. Default 720 (30 days). A successful verification stores trust for max(value, trust-minimum) hours.
trustMinHours=Trust minimum (hours)
trustMinHours.hint=Policy floor: trust is never granted for less than this, even if the remember value is lower. Never below 24; lower submissions are raised to 24 at save time.
totpWindow=Time-step tolerance (steps)
totpWindow.hint=Clock-skew tolerance for TOTP codes, in 30-second steps. 1 accepts the adjacent code before and after the current one.
emailCodeTtlSeconds=Email code validity (seconds)
emailCodeTtlSeconds.hint=How long an emailed one-time code stays valid after sending. Single-use: verification consumes it.
emailResendCooldownSeconds=Email resend throttle (seconds)
emailResendCooldownSeconds.hint=Minimum time between two "send code" requests from the same user, so the mailbox cannot be flooded.
maxAttempts=Failed attempts per window
maxAttempts.hint=Failed TOTP attempts tolerated inside the attempt window before the gate locks the user out.
attemptWindowMinutes=Failure window (minutes)
attemptWindowMinutes.hint=Sliding window over which failed attempts accumulate before the count resets.
lockoutMinutes=Lockout duration (minutes)
lockoutMinutes.hint=How long the gate refuses to challenge a user who exhausted the attempt window. The lockout message shows a countdown.
exemptUsers=Exempt users (one per line)
exemptUsers.hint=Newline-separated usernames fully exempt from the gate, e.g. service accounts that log in with API tokens or are otherwise unattended. Blank lines are ignored.
manageFactorsLink=Factor recovery (locked-out users)
manageFactorsLink.hint=The admin recovery surface (A22-b): clear or revoke another user's MFA factors. Requires Overall/Administer and a session that has verified this login or is on a remembered device.
manageFactorsLink.action=Open
